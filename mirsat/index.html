<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مرصاد - نظام العمليات الميدانية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">مرصاد</div>
    <div class="header-right">
      <div class="weather-info">
        <span id="weather-temp">--</span>
        <span id="weather-desc"></span>
        <span id="weather-humidity"></span>
        <span id="weather-wind"></span>
      </div>
      <div class="clock" id="clock">00:00:00</div>
    </div>
  </header>

  <main class="main">

    <div class="stats">
      <div class="stat-box">
        <span class="stat-num" id="task-count">3</span>
        <span class="stat-label">مهام نشطة</span>
      </div>
      <div class="stat-box warn">
        <span class="stat-num">4</span>
        <span class="stat-label">تحتاج تدخل</span>
      </div>
      <div class="stat-box danger">
        <span class="stat-num">2</span>
        <span class="stat-label">طارئة</span>
      </div>
      <div class="stat-box">
        <span class="stat-num">8</span>
        <span class="stat-label">أفراد ميدانيين</span>
      </div>
    </div>

    <div class="tasks-section">
      <div class="section-header">
        <h2>المهام الميدانية</h2>
        <button class="btn" id="open-modal-btn">+ إضافة مهمة</button>
      </div>

      <table class="tasks-table">
        <thead>
          <tr>
            <th>رقم</th>
            <th>المهمة</th>
            <th>المسؤول</th>
            <th>الأولوية</th>
            <th>الحالة</th>
          </tr>
        </thead>
        <tbody id="tasks-body">
          <tr>
            <td>#001</td>
            <td>مراقبة القطاع الشمالي</td>
            <td>الرقيب أحمد</td>
            <td><span class="badge danger">عاجل</span></td>
            <td><span class="badge warn">جارٍ</span></td>
          </tr>
          <tr>
            <td>#002</td>
            <td>تأمين نقطة التفتيش</td>
            <td>العريف محمد</td>
            <td><span class="badge warn">متوسط</span></td>
            <td><span class="badge green">مكتمل</span></td>
          </tr>
          <tr>
            <td>#003</td>
            <td>توزيع المستلزمات</td>
            <td>الجندي خالد</td>
            <td><span class="badge">عادي</span></td>
            <td><span class="badge">معلق</span></td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <div class="modal-header">
        <h3>+ إضافة مهمة جديدة</h3>
        <button class="modal-close" id="modal-close">X</button>
      </div>
      <div class="modal-body">

        <div class="form-group">
          <label>اسم المهمة <span class="required">*</span></label>
          <input type="text" id="input-name" placeholder="أدخل اسم المهمة" />
          <span class="error-msg" id="error-name"></span>
        </div>

        <div class="form-group">
          <label>المسؤول <span class="required">*</span></label>
          <input type="text" id="input-officer" placeholder="أدخل اسم المسؤول" />
          <span class="error-msg" id="error-officer"></span>
        </div>

        <div class="form-group">
          <label>الأولوية <span class="required">*</span></label>
          <select id="input-priority">
            <option value="">-- اختر الأولوية --</option>
            <option value="عاجل">عاجل</option>
            <option value="متوسط">متوسط</option>
            <option value="عادي">عادي</option>
          </select>
          <span class="error-msg" id="error-priority"></span>
        </div>

      </div>
      <div class="modal-footer">
        <button class="btn-cancel" id="btn-cancel">إلغاء</button>
        <button class="btn-save" id="btn-save">حفظ المهمة</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
